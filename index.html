<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>週五隨筆。傳道書 - 閱讀資料庫</title>
    
    <!-- PWA / 手機安裝支援設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e35">
    
    <!-- iOS (iPhone/iPad) 專用安裝支援 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="傳道書隨筆">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* 採用 Mac / iOS 標準繁體中文字體（PingFang TC / 蘋方） */
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: #f3f6f4; /* 清新禪意淺綠灰調 */
            color: #2c3e35;
        }
        .zen-card {
            background: #ffffff;
            border: 1px solid #d8e2dc;
        }
        .paragraph-block {
            margin-bottom: 1.25rem;
            line-height: 1.8;
        }
        .paragraph-block:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-10">

    <!-- 頂部導航與選擇器 -->
    <header class="w-full bg-white shadow-sm border-b border-emerald-100 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-lg sm:text-xl font-bold text-emerald-850 tracking-wider">🌿 週五隨筆・傳道書</h1>
            
            <!-- 功能區：章節選擇器 + 字體大小調整 -->
            <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-end">
                <select id="verseSelect" class="bg-emerald-50 border border-emerald-300 text-emerald-950 text-base font-semibold rounded-lg focus:ring-emerald-500 focus:border-emerald-500 p-2 outline-none transition flex-grow sm:w-56">
                    <option value="">載入資料庫中...</option>
                </select>

                <!-- 字體大小控制按鈕 (A- / A+) -->
                <div class="flex items-center gap-1 bg-emerald-50 border border-emerald-300 rounded-lg p-1 shrink-0">
                    <span class="text-xs text-emerald-800 px-1 font-bold">字體</span>
                    <button onclick="changeFontSize(-1)" class="w-7 h-7 bg-white hover:bg-emerald-100 text-emerald-950 rounded font-bold text-xs shadow-sm transition flex items-center justify-center" title="縮小字體">A-</button>
                    <button onclick="changeFontSize(1)" class="w-7 h-7 bg-white hover:bg-emerald-100 text-emerald-950 rounded font-bold text-xs shadow-sm transition flex items-center justify-center" title="放大字體">A+</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-3xl w-full mx-auto px-4 mt-6 flex-grow">
        <div id="loadingIndicator" class="text-center py-20 text-emerald-700">
            <p class="text-base animate-pulse">正在從文字檔案讀取資料庫...</p>
        </div>

        <div id="contentContainer" class="hidden space-y-6">
            <!-- 閱讀卡片 -->
            <div class="zen-card rounded-2xl p-6 sm:p-8 shadow-sm">
                <!-- 經文章節標題與導航按鈕 -->
                <div class="flex items-center justify-between border-b border-emerald-100 pb-4 mb-5">
                    <span id="verseTitle" class="text-2xl sm:text-3xl font-bold text-emerald-950 bg-emerald-100/80 px-3.5 py-1 rounded-md tracking-wide"></span>
                    <div class="flex items-center gap-2">
                        <!-- 上一篇按鈕 -->
                        <button id="prevBtn" onclick="changeVerse(-1)" class="px-3.5 py-1.5 text-xs sm:text-sm font-semibold text-emerald-750 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed">上一段</button>
                        <!-- 下一篇按鈕 -->
                        <button id="nextBtn" onclick="changeVerse(1)" class="px-3.5 py-1.5 text-xs sm:text-sm font-semibold text-emerald-750 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed">下一段</button>
                    </div>
                </div>

                <!-- 經文內文區塊 -->
                <div id="scriptureText" class="text-emerald-950 font-bold bg-emerald-50/80 p-5 rounded-xl mb-6 border-l-4 border-emerald-600 shadow-sm leading-relaxed transition-all"></div>

                <!-- 默想與隨筆文章內文 -->
                <div id="reflectionText" class="text-gray-800 leading-relaxed text-justify transition-all"></div>

                <!-- 語音朗讀控制列 -->
                <div class="mt-8 pt-4 border-t border-emerald-100 flex flex-wrap items-center justify-between gap-3 bg-emerald-50/40 p-4 rounded-xl">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-emerald-850 font-semibold tracking-wide">廣東話朗讀 (Siri 聲音風格)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="playBtn" onclick="toggleSpeech()" class="bg-emerald-650 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition flex items-center gap-1.5" style="background-color: #2e7d32;">
                            <svg id="playIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span id="playText">聆聽整段</span>
                        </button>
                        <button onclick="stopSpeech()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-xl text-sm font-medium transition">停止</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 右下角極細版本編號 -->
    <footer class="w-full text-right px-4 mt-6">
        <span class="text-[10px] text-gray-400 font-mono tracking-tighter select-none">v1.7.0</span>
    </footer>

    <!-- JavaScript 解析器與邏輯 -->
    <script>
        let dbEntries = [];
        let currentIndex = 0;
        let fontSizeLevel = parseInt(localStorage.getItem('fontSizeLevel')) || 2;
        
        const fontScaleConfigs = [
            { scripture: 'text-lg sm:text-xl', reflection: 'text-base sm:text-lg' },
            { scripture: 'text-xl sm:text-2xl', reflection: 'text-lg sm:text-xl' },
            { scripture: 'text-2xl sm:text-3xl', reflection: 'text-xl sm:text-2xl' },
            { scripture: 'text-3xl sm:text-4xl', reflection: 'text-2xl sm:text-3xl' }
        ];

        let synth = window.speechSynthesis;
        let utterance = null;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('週五隨筆。傳道書.txt');
                if (!response.ok) throw new Error('無法讀取資料庫檔案');
                const rawText = await response.text();
                parseDatabase(rawText);
            } catch (error) {
                console.error(error);
                document.getElementById('loadingIndicator').innerHTML = `
                    <p class="text-red-500 font-medium">無法自動載入「週五隨筆。傳道書.txt」檔案。</p>
                    <p class="text-xs text-gray-500 mt-2">請確保檔案放在同一個 GitHub Repository 目錄下。</p>
                `;
            }
        });

        function parseDatabase(text) {
            const rawSections = text.split('【週五隨筆。傳道書】');
            dbEntries = [];

            rawSections.forEach(section => {
                const trimmed = section.trim();
                if (!trimmed) return;

                const rawLines = trimmed.split('\n');
                let verseRef = "";
                let contentStartIndex = 0;
                for (let i = 0; i < rawLines.length; i++) {
                    if (rawLines[i].trim().length > 0) {
                        verseRef = rawLines[i].trim();
                        contentStartIndex = i + 1;
                        break;
                    }
                }

                if (!verseRef) return;

                const bodyLines = rawLines.slice(contentStartIndex);
                let scriptureLines = [];
                let reflectionLines = [];
                let isReflection = false;

                for (let line of bodyLines) {
                    if (line.includes('＊歡迎轉載')) continue;
                    if (line.includes('……………………')) {
                        isReflection = true;
                        continue;
                    }

                    if (!isReflection) {
                        if (line.trim().startsWith('*') || line.trim().endsWith('*') || scriptureLines.length === 0) {
                            scriptureLines.push(line);
                        } else {
                            isReflection = true;
                            reflectionLines.push(line);
                        }
                    } else {
                        reflectionLines.push(line);
                    }
                }

                dbEntries.push({
                    title: verseRef,
                    scripture: scriptureLines.join('\n'),
                    reflection: reflectionLines.join('\n')
                });
            });

            if (dbEntries.length > 0) {
                populateSelector();
                
                let savedIndex = parseInt(localStorage.getItem('lastReadIndex'));
                if (isNaN(savedIndex) || savedIndex < 0 || savedIndex >= dbEntries.length) {
                    savedIndex = 0;
                }
                
                displayEntry(savedIndex);
                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('contentContainer').classList.remove('hidden');
            } else {
                document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500">解析檔案失敗，未找到有效內容。</p>`;
            }
        }

        function populateSelector() {
            const select = document.getElementById('verseSelect');
            select.innerHTML = '';
            dbEntries.forEach((entry, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${entry.title}`;
                option.className = "font-semibold";
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                stopSpeech();
                currentIndex = parseInt(e.target.value);
                displayEntry(currentIndex);
            });
        }

        function displayEntry(index) {
            currentIndex = index;
            localStorage.setItem('lastReadIndex', currentIndex);

            document.getElementById('verseSelect').value = index;
            document.getElementById('verseTitle').textContent = dbEntries[index].title;

            const entry = dbEntries[index];
            const cleanScripture = entry.scripture.replace(/\*/g, '');
            
            const currentConfig = fontScaleConfigs[fontSizeLevel];
            
            const scriptureEl = document.getElementById('scriptureText');
            scriptureEl.className = `text-emerald-950 font-bold bg-emerald-50/80 p-5 rounded-xl mb-6 border-l-4 border-emerald-600 shadow-sm leading-relaxed transition-all ${currentConfig.scripture}`;
            scriptureEl.innerHTML = formatParagraphs(cleanScripture);

            const reflectionEl = document.getElementById('reflectionText');
            reflectionEl.className = `text-gray-800 leading-relaxed text-justify transition-all ${currentConfig.reflection}`;
            reflectionEl.innerHTML = formatParagraphs(entry.reflection);

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === dbEntries.length - 1;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeFontSize(direction) {
            fontSizeLevel += direction;
            if (fontSizeLevel < 0) fontSizeLevel = 0;
            if (fontSizeLevel >= fontScaleConfigs.length) fontSizeLevel = fontScaleConfigs.length - 1;
            
            localStorage.setItem('fontSizeLevel', fontSizeLevel);
            displayEntry(currentIndex);
        }

        function formatParagraphs(text) {
            const paragraphs = text.split(/\n\s*\n/);
            return paragraphs
                .map(p => {
                    const cleanP = p.trim().replace(/\n/g, '<br>');
                    return cleanP ? `<p class="paragraph-block">${cleanP}</p>` : '';
                })
                .join('');
        }

        function changeVerse(direction) {
            stopSpeech();
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < dbEntries.length) {
                displayEntry(newIndex);
            }
        }

        // 將經文章節標題（如 傳1:2 或 傳7:11-12）轉成完美語音朗讀的格式
        function formatTitleForSpeech(title) {
            // 匹配格式例如：傳1:2 或 傳7:11-12
            const match = title.match(/^傳(\d+):(\d+)(?:-(\d+))?$/);
            if (match) {
                const chapter = match[1];
                const verseStart = match[2];
                const verseEnd = match[3];
                if (verseEnd) {
                    return `傳道書第${chapter}章第${verseStart}至第${verseEnd}節`;
                } else {
                    return `傳道書第${chapter}章第${verseStart}節`;
                }
            }
            return title.replace('傳', '傳道書');
        }

        function toggleSpeech() {
            if (synth.speaking) {
                if (synth.paused) {
                    synth.resume();
                    document.getElementById('playText').textContent = '暫停朗讀';
                } else {
                    synth.pause();
                    document.getElementById('playText').textContent = '繼續朗讀';
                }
                return;
            }

            const entry = dbEntries[currentIndex];
            
            // 使用專用函數將標題轉化為語音友好的讀法，畫面顯示保持原狀
            const spokenTitle = formatTitleForSpeech(entry.title);
            
            const cleanText = `${spokenTitle}。${entry.scripture}。${entry.reflection}`
                .replace(/\*/g, '')
                .replace(/<[^>]*>/g, '');

            utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-HK';
            utterance.rate = 1.0;

            const voices = synth.getVoices();
            const hkVoice = voices.find(v => v.lang === 'zh-HK' && (v.name.includes('Sin-ji') || v.name.includes('HiuMaan') || v.name.includes('Female') || v.name.includes('女')));
            if (hkVoice) {
                utterance.voice = hkVoice;
            }

            utterance.onstart = () => {
                document.getElementById('playText').textContent = '暫停朗讀';
            };

            utterance.onend = () => {
                document.getElementById('playText').textContent = '聆聽整段';
            };

            utterance.onerror = () => {
                document.getElementById('playText').textContent = '聆聽整段';
            };

            synth.speak(utterance);
        }

        function stopSpeech() {
            if (synth) {
                synth.cancel();
                document.getElementById('playText').textContent = '聆聽整段';
            }
        }
    </script>
</body>
</html>
